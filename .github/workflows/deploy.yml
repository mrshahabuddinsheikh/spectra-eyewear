name: Deploy Spectra Eyewear to cPanel & CloudLinux

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js v20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Step 1: Install Monorepo Dependencies
        run: |
          npm ci --include=dev

      - name: ⚡ Step 2: Compile Fastify Standalone Bundle via esbuild
        run: |
          npm run build:api

      - name: 🏗️ Step 3: Build Next.js Production Storefront
        run: |
          npm run build:web
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: 📦 Step 4: Bundle Clean Release Tarball
        run: |
          mkdir -p release-bundle
          # Copy essential root files
          cp package.json server.js release-bundle/
          mkdir -p release-bundle/tmp
          touch release-bundle/tmp/restart.txt

          # Copy Fastify production build & essentials
          mkdir -p release-bundle/apps/api
          cp apps/api/package.json release-bundle/apps/api/
          cp -r apps/api/dist release-bundle/apps/api/

          # Copy Next.js production standalone artifacts
          mkdir -p release-bundle/apps/web
          cp apps/web/package.json release-bundle/apps/web/
          cp apps/web/next.config.mjs release-bundle/apps/web/
          cp -r apps/web/.next release-bundle/apps/web/
          if [ -d apps/web/public ]; then
            cp -r apps/web/public release-bundle/apps/web/
          fi

          # Install production-only dependencies in release bundle
          cd release-bundle
          npm install --omit=dev --legacy-peer-deps
          cd ..

          # Archive bundle
          tar -czf spectra-release.tar.gz -C release-bundle .
          ls -lh spectra-release.tar.gz

      - name: 🚀 Step 5: Transfer Release via SCP to cPanel
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "spectra-release.tar.gz"
          target: ${{ secrets.SSH_TARGET_DIR }}

      - name: 🔄 Step 6: Post-Deploy SSH Extraction, Idempotent Seed & Passenger Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.SSH_TARGET_DIR }}
            echo "📂 Extracting release bundle..."
            tar -xzf spectra-release.tar.gz -C .
            rm -f spectra-release.tar.gz

            echo "🌱 Running idempotent database seed..."
            if [ -f apps/api/dist/seed.js ]; then
              node apps/api/dist/seed.js || echo "Seed completed with notice"
            fi

            echo "🔒 Ensuring secure permissions..."
            find . -type d -exec chmod 755 {} +
            find . -type f -exec chmod 644 {} +
            chmod 755 server.js
            chmod -R 775 tmp

            echo "🔄 Triggering Phusion Passenger restart..."
            mkdir -p tmp
            touch tmp/restart.txt
            echo "✅ Deployment completed successfully!"
